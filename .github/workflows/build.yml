name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Распаковать проект
        run: unzip -q DeutschSRS_S23Ultra_APKProject_v2_fixed.zip

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Gradle 8.14.3
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q gradle-8.14.3-bin.zip -d $HOME
          echo "$HOME/gradle-8.14.3/bin" >> $GITHUB_PATH

      - name: Принять лицензии Android SDK
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Собрать debug APK
        working-directory: DeutschSRS_S23Ultra_APKProject
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: DeutschSRS-debug-apk
          path: DeutschSRS_S23Ultra_APKProject/app/build/outputs/apk/debug/app-debug.apk
